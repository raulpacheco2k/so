# Habilita os perfis de audio Bluetooth que o servidor e o dispositivo
# anunciarem. A politica e baseada em capacidades, nao em fabricante, nome ou
# endereco MAC.
monitor.bluez.properties = {
  bluez5.roles = [
    a2dp_sink
    a2dp_source
    bap_sink
    bap_source
    hfp_hf
    hsp_hs
  ]
}

# Permite que os perfis suportados sejam negociados quando o dispositivo e
# conectado. A politica do WirePlumber continua escolhendo apenas combinacoes
# compativeis; A2DP e preservado ate que uma entrada de microfone seja pedida.
monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [
          a2dp_sink
          a2dp_source
          bap_sink
          bap_source
          hfp_hf
          hsp_hs
        ]
      }
    }
  }
]
