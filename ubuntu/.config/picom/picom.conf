# Picom configuration (for Alacritty transparency on i3)
backend = "glx"

active-opacity = 1.0
inactive-opacity = 0.97
inactive-opacity-override = true

# Suaviza arestas das janelas
corner-radius = 0.0
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
]

shadow = true
shadow-radius = 12
shadow-opacity = 0.35
shadow-offset-x = -8
shadow-offset-y = -8
shadow-exclude = [ "name = 'Notification'", "class_i = 'Bar'", "_GTK_NAMED_WINDOW = 'transient'" ]

fading = true
fade-in-step = 0.03
fade-out-step = 0.03

# Walker precisa abrir instantâneo (sem fade)
fade-exclude = [ "class_g = 'walker'" ]

# Na transparência, permite que o tema acima apareça
opacity-exclude = [ "class_g = 'i3bar'" ]

# Em layout tabbed/stacked, uma janela transparente (ex.: alacritty) atrás
# da qual fica outra janela deve mostrar o wallpaper, não a janela coberta.
# O transparent-clipping "recorta" o que está atrás e mostra o fundo do desktop.
# (A regra antiga com _NET_WM_STATE_HIDDEN não funciona no i3 4.25, que não
# define esse atom em janelas ocultas de tabbed/stacked.)
transparent-clipping = true
